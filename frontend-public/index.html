<!DOCTYPE html>
<html lang="es">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Estilos: src/main.js · Lógica SPA: js/router.js, js/auth.js (MOCK) -->

  <script src="js/router.js" defer></script>

<!-- NAVEGACIÓN -->
<nav>
  <a class="logo" id="logo-link" href="#">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="1" width="5" height="5" rx="1.5" fill="white"/>
        <rect x="8" y="1" width="5" height="5" rx="1.5" fill="white" opacity=".7"/>
        <rect x="1" y="8" width="5" height="5" rx="1.5" fill="white" opacity=".7"/>
        <rect x="8" y="8" width="5" height="5" rx="1.5" fill="white" opacity=".4"/>
      </svg>
    </div>
    Piloto CMS
  </a>

  <div style="display:flex; align-items:center; gap:8px;">
    <button class="nav-pill nav-ghost" id="nav-pill-login">Iniciar sesión</button>
    <button class="nav-pill nav-solid" id="nav-pill-register">Crear cuenta</button>
  </div>
</nav>


<!-- PÁGINA: INICIO (contenido en Vue — src/views/PageHome.vue) -->
<main class="page active" id="page-home">
  <div id="app"></div>
</main>


<!-- PÁGINA: LOGIN (contenido en Vue — src/views/PageLogin.vue) -->
<main class="page form-page" id="page-login">
  <div id="app-login"></div>
</main>


<!-- PÁGINA: REGISTRO (contenido en Vue — src/views/PageRegister.vue) -->
<main class="page form-page" id="page-register">
  <div id="app-register"></div>
</main>


<!-- PÁGINA: RECUPERAR CONTRASEÑA (contenido en Vue — src/views/PageForgot.vue) -->
<main class="page form-page" id="page-forgot">
  <div id="app-forgot"></div>
</main>


<div class="toaster" id="toaster"></div>
